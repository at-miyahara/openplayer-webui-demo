<style>
  /* デモの断り書き。閉じるまで出しっぱなしにするので、隅のバッジではなく中央のオーバーレイ。
     色は本体UIのトークンをそのまま使う（別のデザインを持ち込まない＝テーマ切替にも自動で追従）。
     <dialog>+showModal() は sandbox 付き iframe（Notion 等の埋め込み）で禁止されるため使わない。
     本体UIも同じ理由で uiModal にフォールバックを持っている（webui/src/js/common/50-common.js）。 */
  .demo-overlay {
    position: fixed; inset: 0; z-index: 10000;
    display: grid; place-items: center;
    padding: 20px;
    background: rgba(8, 11, 15, .62);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .demo-modal {
    width: min(100%, 34rem);
    box-sizing: border-box;
    padding: 26px 26px 20px;
    border: 1px solid var(--border, #d8dee6);
    border-radius: 14px;
    background: var(--surface, #fff);
    color: var(--fg, #1b2128);
    box-shadow: 0 24px 64px rgba(0, 0, 0, .38);
    font: 400 15px/1.7 system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    text-wrap: pretty;
  }
  .demo-modal p { margin: 0 0 12px; }
  .demo-modal p.lead { font-size: 17px; font-weight: 600; line-height: 1.6; }
  .demo-modal p.sub { color: var(--muted, #5b6573); }
  .demo-modal-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
  .demo-modal button {
    border: 0; border-radius: 8px; cursor: pointer;
    padding: 10px 22px;
    font: 600 15px/1 system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--primary-bg, #087454); color: var(--primary-fg, #fff);
  }
  .demo-modal button:hover { background: var(--primary-hover, #065f46); }
  .demo-modal button:focus-visible { outline: 2px solid var(--accent, #0f8f68); outline-offset: 3px; }
  @media (prefers-reduced-motion: no-preference) {
    .demo-overlay { animation: demo-fade .2s ease-out both; }
    .demo-modal { animation: demo-rise .26s cubic-bezier(.2, .8, .3, 1) both; }
    @keyframes demo-fade { from { opacity: 0; } }
    @keyframes demo-rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  }
</style>
<script>
  /* =====================================================================
     デモ用シム。実機の /api/* を、焼き込んだスナップショットで肩代わりする。
       - GET  は控えを返す（POSTで書いた内容はセッション中だけ反映＝触った結果が残る）
       - POST は {"ok":true}。実機も再起動もしないので破壊的な操作は起きない
     本体UIのコードには一切手を入れていない（webui/index.html をそのまま使う）。
     ===================================================================== */
  (function () {
    var FX = {};
    document.querySelectorAll('script[data-fx]').forEach(function (s) {
      try { FX[s.getAttribute('data-fx')] = JSON.parse(s.textContent); } catch (e) { }
    });

    // POSTされた内容を持つ可変ステート。GETはここを見るので、編集→保存→再読込が通る
    var state = {
      config: FX.config || {},
      network: FX.network || {},
      ntp: FX.ntp || {},
      triggers: FX.triggers || {}
    };

    // 実機は毎秒 renderAvg/Max を出し直すので、止まって見えないよう軽く揺らす
    function status() {
      var s = Object.assign({}, FX.status || {});
      s.renderAvgUs = 128 + Math.floor(Math.random() * 22);
      s.renderMaxUs = s.renderAvgUs + 120 + Math.floor(Math.random() * 240);
      s.tickN = 460 + Math.floor(Math.random() * 30);
      return s;
    }

    var WIFI = {
      status: 'ok',
      networks: [
        { ssid: 'Studio-5G', rssi: -48 }, { ssid: 'Studio-2G', rssi: -55 },
        { ssid: 'Venue-Guest', rssi: -67 }, { ssid: 'BackstageAP', rssi: -74 }
      ]
    };

    function reply(obj, status) {
      return new Response(JSON.stringify(obj), {
        status: status || 200,
        headers: { 'Content-Type': 'application/json' }
      });
    }

    function route(method, path, q, body) {
      if (method === 'GET') {
        switch (path) {
          case '/api/status': return reply(status());
          case '/api/config': return reply(state.config);
          case '/api/triggers': return reply(state.triggers);
          case '/api/network': return reply(state.network);
          case '/api/ntp': return reply(Object.assign({}, state.ntp, { now: new Date().toISOString().slice(0, 19) }));
          case '/api/audiolist': return reply(FX.audiolist || { sd: true, files: [] });
          case '/api/wifi_scan': return reply(WIFI);
          case '/api/showget': {
            var k = 'show_' + (q.get('id') || '');
            return FX[k] ? reply(FX[k]) : reply({ ok: false, err: 'not_found' }, 404);
          }
          // 背景画像と音声の実体は載せていない（容量）。本体同様 404 を返して、UI側の分岐に任せる
          case '/api/layoutbg':
          case '/api/audioget': return reply({ ok: false, err: 'not_found' }, 404);
        }
        return reply({ ok: false, err: 'demo' }, 404);
      }
      // 保存系: 送られた内容を控えに反映しておくと、デモでも編集結果が残って見える
      if (body && typeof body === 'object') {
        if (path === '/api/config') state.config = Object.assign({}, state.config, body);
        if (path === '/api/network') state.network = Object.assign({}, state.network, body);
        if (path === '/api/ntp') state.ntp = Object.assign({}, state.ntp, body);
      }
      return reply({ ok: true });
    }

    function isApi(u) { return u.pathname.indexOf('/api/') === 0; }

    var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
    window.fetch = function (input, init) {
      var raw = (typeof input === 'string') ? input : (input && input.url) || '';
      var u;
      try { u = new URL(raw, location.href); } catch (e) { return nativeFetch(input, init); }
      if (!isApi(u)) return nativeFetch(input, init);
      var method = ((init && init.method) || (input && input.method) || 'GET').toUpperCase();
      var body = null;
      var raw_body = init && init.body;
      if (typeof raw_body === 'string') { try { body = JSON.parse(raw_body); } catch (e) { } }
      // 実機の応答らしい間を置く（即応だとローディング表示の検証にならない）
      return new Promise(function (res) {
        setTimeout(function () { res(route(method, u.pathname, u.searchParams, body)); }, 70);
      });
    };

    /* XHRはOTAと音声アップロードが使う。ネイティブのまま open だけ見て、
       /api/ 宛なら送信を横取りして進捗つきで成功を返す。それ以外は素通し。 */
    var XO = XMLHttpRequest.prototype.open, XS = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.open = function (m, url) {
      var u; try { u = new URL(url, location.href); } catch (e) { u = null; }
      this.__demo = !!(u && isApi(u));
      if (!this.__demo) return XO.apply(this, arguments);
    };
    XMLHttpRequest.prototype.send = function () {
      if (!this.__demo) return XS.apply(this, arguments);
      var self = this, pct = 0;
      var set = function (k, v) { Object.defineProperty(self, k, { value: v, configurable: true }); };
      var iv = setInterval(function () {
        pct += 9;
        if (self.upload && self.upload.onprogress) self.upload.onprogress({ lengthComputable: true, loaded: pct, total: 100 });
        if (pct < 100) return;
        clearInterval(iv);
        if (self.upload && self.upload.onload) self.upload.onload({});
        setTimeout(function () {
          set('readyState', 4); set('status', 200);
          set('responseText', '{"ok":true}'); set('response', '{"ok":true}');
          if (self.onreadystatechange) self.onreadystatechange({});
          if (self.onload) self.onload({});
        }, 420);
      }, 80);
    };

    // 断り書き。本体UIのDOM構築より後に足したいので DOMContentLoaded で。
    // 自動では消さない＝閉じるまで出したままにする。
    document.addEventListener('DOMContentLoaded', function () {
      var prev = document.activeElement;
      var ov = document.createElement('div');
      ov.className = 'demo-overlay';
      ov.setAttribute('role', 'dialog');
      ov.setAttribute('aria-modal', 'true');
      ov.setAttribute('aria-labelledby', 'demo-modal-lead');

      var box = document.createElement('div');
      box.className = 'demo-modal';
      box.innerHTML =
        '<p class="lead" id="demo-modal-lead">これは新コントローラーの操作をテストするためのデモページです。</p>'
        + '<p class="sub">一通りの操作を確認できますが、本体への転送など実機が必要な機能は動作しません。</p>';

      var actions = document.createElement('div');
      actions.className = 'demo-modal-actions';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '閉じる';
      actions.appendChild(btn);
      box.appendChild(actions);
      ov.appendChild(box);

      function close() {
        ov.remove();
        document.removeEventListener('keydown', onKey, true);
        if (prev && prev.focus) prev.focus();
      }
      // Esc は閉じる操作。背景クリックでは閉じない（読む前に誤って消さないため）
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); close(); return; }
        // 開いている間はフォーカスをモーダル内に留める
        if (e.key === 'Tab' && !box.contains(e.target)) { e.preventDefault(); btn.focus(); }
      }
      btn.addEventListener('click', close);
      document.addEventListener('keydown', onKey, true);

      document.body.appendChild(ov);
      btn.focus();
    });
  })();
</script>
